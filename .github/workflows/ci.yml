name: CI/CD

# gitleaks y los tests en cada push y cada PR. En push a main, además, se publica la
# imagen del servidor en GHCR; la VM la trae sola (ver "Despliegue" en hit1/README.md).
on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Detección de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Si encuentra un secret en el código o en el historial, el pipeline falla.
      - name: Escanear secrets con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hit1-unitarios:
    name: Hit 1 — tests unitarios y de API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit1/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar
        run: python -m compileall -q app tests
      - name: Tests
        run: python -m pytest -v
      - name: Tests del servicio tarea
        working-directory: hit1/tarea
        run: python -m pytest -v

  hit1-integracion:
    name: Hit 1 — integración con Docker
    runs-on: ubuntu-latest
    needs: hit1-unitarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r hit1/servidor/requirements-dev.txt
      # Construye las imágenes, levanta el servidor, espera a healthy, corre los
      # tests contra Docker real y baja todo.
      - name: Levantar y probar
        run: PYTHON=python hit1/servidor/tests/integracion.sh

  hit1-imagen:
    name: Hit 1 — publicar la imagen del servidor
    runs-on: ubuntu-latest
    needs: [gitleaks, hit1-integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # GHCR con el GITHUB_TOKEN efímero del job: ningún secret cargado a mano
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}-hit1"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagen:$GITHUB_SHA" -t "$imagen:latest" hit1/servidor
          docker push "$imagen:$GITHUB_SHA"
          docker push "$imagen:latest"
          echo "Publicada $imagen:$GITHUB_SHA (y :latest). La VM la levanta en menos de un minuto."
