name: CI/CD

# gitleaks y los tests en cada push y cada PR. En push a main, además, se publica la
# imagen del servidor en GHCR, la VM la trae sola (ver "Despliegue" en hit1/README.md) y
# se prueba lo desplegado con el cliente.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Detección de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Si encuentra un secret en el código o en el historial, el pipeline falla. Se usa
      # el binario y no gitleaks-action, que en repos de organizaciones pide licencia.
      - name: Escanear secrets con gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact -v .

  hit1-unitarios:
    name: Hit 1 — tests unitarios y de API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit1/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar
        run: python -m compileall -q app tests
      - name: Tests
        run: python -m pytest -v
      - name: Tests del servicio tarea
        working-directory: hit1/tarea
        run: python -m pytest -v

  hit1-integracion:
    name: Hit 1 — integración con Docker
    runs-on: ubuntu-latest
    needs: hit1-unitarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r hit1/servidor/requirements-dev.txt
      # Construye las imágenes, levanta el servidor, espera a healthy, corre los
      # tests contra Docker real y baja todo.
      - name: Levantar y probar
        run: PYTHON=python bash hit1/servidor/tests/integracion.sh

  hit1-imagen:
    name: Hit 1 — publicar la imagen del servidor
    runs-on: ubuntu-latest
    needs: [gitleaks, hit1-integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # GHCR con el GITHUB_TOKEN efímero del job: ningún secret cargado a mano
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}-hit1"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagen:$GITHUB_SHA" -t "$imagen:latest" hit1/servidor
          docker push "$imagen:$GITHUB_SHA"
          docker push "$imagen:latest"
          echo "Publicada $imagen:$GITHUB_SHA (y :latest). La VM la levanta en menos de un minuto."

  hit1-desplegado:
    name: Hit 1 — prueba contra lo desplegado
    runs-on: ubuntu-latest
    needs: hit1-imagen
    env:
      TP2_SERVIDOR: ${{ vars.TP2_HIT1_URL || 'http://18.231.127.74:8081' }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandar tareas al servidor público con el cliente
        run: |
          cliente() { python3 hit1/cliente/cliente.py "$@" --imagen cerberusdistribuido/tarea:1.0.0; }
          # La VM levanta la imagen nueva en hasta un minuto: se reintenta hasta 3 minutos.
          for intento in $(seq 12); do
            cliente suma '{"a": 3, "b": 4}' > suma.json && break
            sleep 15
          done
          cat suma.json
          grep -q '"resultado": 7' suma.json
          cliente division '{"a": 1, "b": 0}' > division.json || true
          cat division.json
          grep -q '"codigo": 422' division.json

  hit2-unitarios:
    name: Hit 2 — tests unitarios y de API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit2/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar
        run: python -m compileall -q app tests
      - name: Tests
        run: python -m pytest -v -m "not integracion"
      - name: Tests del servicio tarea
        working-directory: hit2/tarea
        run: python -m pytest -v

  hit2-integracion:
    name: Hit 2 — integración con Docker
    runs-on: ubuntu-latest
    needs: hit2-unitarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r hit2/servidor/requirements-dev.txt
      - name: Levantar y probar
        run: PYTHON=python bash hit2/servidor/tests/integracion.sh

  hit2-imagen:
    name: Hit 2 — publicar la imagen del servidor
    runs-on: ubuntu-latest
    needs: [gitleaks, hit2-integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}-hit2"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagen:$GITHUB_SHA" -t "$imagen:latest" hit2/servidor
          docker push "$imagen:$GITHUB_SHA"
          docker push "$imagen:latest"
          echo "Publicada $imagen:$GITHUB_SHA (y :latest). La VM la levanta en menos de un minuto."

  hit2-desplegado:
    name: Hit 2 — prueba contra lo desplegado
    runs-on: ubuntu-latest
    needs: hit2-imagen
    env:
      TP2_SERVIDOR: ${{ vars.TP2_HIT2_URL || 'http://18.231.127.74:8082' }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandar tareas al servidor público con el cliente
        run: |
          cliente() { python3 hit2/cliente/cliente.py "$@" --imagen cerberusdistribuido/tarea:1.0.0; }
          for intento in $(seq 12); do
            cliente suma '{"a": 3, "b": 4}' > suma.json && break
            sleep 15
          done
          cat suma.json
          grep -q '"resultado": 7' suma.json
          grep -q '"lamport_ts"' suma.json
          cliente division '{"a": 1, "b": 0}' > division.json || true
          cat division.json
          grep -q '"codigo": 422' division.json

  hit3-unitarios:
    name: Hit 3 — tests unitarios y de API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hit3/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Compilar
        run: python -m compileall -q app tests
      - name: Tests (incluido Bully con una red en memoria)
        run: python -m pytest -v
      - name: Tests del servicio tarea
        working-directory: hit3/tarea
        run: python -m pytest -v

  hit3-integracion:
    name: Hit 3 — integración con Docker (cluster y caídas)
    runs-on: ubuntu-latest
    needs: hit3-unitarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: pip install -r hit3/servidor/requirements-dev.txt
      # Levanta los 3 nodos y nginx, mata al coordinador y a un ejecutor, y baja todo.
      - name: Levantar y probar
        run: PYTHON=python bash hit3/servidor/tests/integracion.sh

  hit3-imagen:
    name: Hit 3 — publicar la imagen de los nodos
    runs-on: ubuntu-latest
    needs: [gitleaks, hit3-integracion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar en GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}-hit3"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagen:$GITHUB_SHA" -t "$imagen:latest" hit3/servidor
          docker push "$imagen:$GITHUB_SHA"
          docker push "$imagen:latest"
          echo "Publicada $imagen:$GITHUB_SHA (y :latest). La VM la levanta en menos de un minuto."

  hit3-desplegado:
    name: Hit 3 — prueba contra lo desplegado
    runs-on: ubuntu-latest
    needs: hit3-imagen
    env:
      TP2_SERVIDOR: ${{ vars.TP2_HIT3_URL || 'http://18.231.127.74:8083' }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandar tareas al cluster público con el cliente
        run: |
          cliente() { python3 hit3/cliente/cliente.py "$@" --imagen cerberusdistribuido/tarea:1.0.0; }
          # La VM levanta la imagen nueva en hasta un minuto: se reintenta hasta 3 minutos.
          for intento in $(seq 12); do
            cliente suma '{"a": 3, "b": 4}' > suma.json && break
            sleep 15
          done
          cat suma.json
          grep -q '"resultado": 7' suma.json
          grep -q '"nodo"' suma.json
          cliente division '{"a": 1, "b": 0}' > division.json || true
          cat division.json
          grep -q '"codigo": 422' division.json
      - name: Hay coordinador y los 3 nodos están vivos
        run: |
          for intento in $(seq 6); do  # round-robin: alguna vez contesta el coordinador
            curl -s "$TP2_SERVIDOR/health" > health.json
            python3 -c 'import json, sys; c = json.load(open("health.json"))["contenido"]["cluster"]; sys.exit(0 if c.get("rol") == "coordinador" and [n["estado"] for n in c["nodos"].values()] == ["vivo"] * 3 else 1)' && break
            sleep 1
          done
          cat health.json
          python3 -c 'import json; c = json.load(open("health.json"))["contenido"]["cluster"]; assert c["rol"] == "coordinador" and len(c["nodos"]) == 3, c'
