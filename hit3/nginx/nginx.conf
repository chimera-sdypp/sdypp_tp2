# Balanceador del Hit 3: reparte los pedidos de los clientes entre los 3 nodos.
#
# Publica sólo /getRemoteTask y /health. Las rutas /cluster/* (elección,
# heartbeats, asignación) son entre nodos: desde afuera son un 404.

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # DNS de Docker. Con `resolve` nginx vuelve a resolver los nombres de los nodos
    # cada 2 s: un nodo muerto sale del upstream, y el que vuelve (con otra IP) entra.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream nodos {
        zone nodos 64k;
        # Round-robin. Si un nodo no acepta la conexión, se lo saca por 5 s.
        server nodo1:8080 resolve max_fails=1 fail_timeout=5s;
        server nodo2:8080 resolve max_fails=1 fail_timeout=5s;
        server nodo3:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        default_type application/json;

        # Si la conexión con un nodo falla antes de mandarle el pedido, se prueba
        # con el siguiente (también para POST: el nodo no llegó a recibirlo). Si el
        # nodo se cae con el pedido ya enviado, no se reintenta: el cliente recibe 502.
        proxy_next_upstream error timeout;
        proxy_connect_timeout 1s;
        # Una tarea puede incluir el pull de la imagen y la espera del contenedor.
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Los errores propios de nginx salen con el mismo sobre que los de los nodos.
        error_page 502 503 504 = @sin_nodos;

        location = /getRemoteTask {
            proxy_pass http://nodos;
        }

        location = /health {
            proxy_pass http://nodos;
        }

        location / {
            return 404 '{"codigo": 404, "contenido": {"error": {"tipo": "RUTA_INEXISTENTE", "mensaje": "no existe la ruta $uri", "detalles": []}}}';
        }

        location @sin_nodos {
            return 502 '{"codigo": 502, "contenido": {"error": {"tipo": "NODO_NO_DISPONIBLE", "mensaje": "ningún nodo pudo atender el pedido", "detalles": []}}}';
        }
    }
}
