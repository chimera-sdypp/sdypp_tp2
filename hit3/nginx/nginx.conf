# ==============================================================================
# Balanceador Nginx del Hit 3 — Seguridad Perimetral y Round-Robin Multi-Nodo
# ==============================================================================
# Responsabilidades Arquitectónicas:
# 1. Punto de entrada único para clientes externos (análogo a un Ingress de K8s).
# 2. Balanceo de carga round-robin con resolución dinámica de DNS Docker (127.0.0.11).
# 3. SEGURIDAD PERIMETRAL: Expone únicamente /getRemoteTask, /stats y /health.
#    Las rutas de consenso /cluster/* (Bully, heartbeats) quedan bloqueadas (404).
# 4. Homogeneización de errores: Errores 502/503/504 y 413 devuelven el sobre R3.
# ==============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # DNS interno de Docker: 'resolve' permite que Nginx vuelva a consultar IPs
    # cada 2 segundos ante la caída o reincorporación de un contenedor nodo.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream nodos {
        zone nodos 64k;
        # Reparto Round-Robin entre los 3 nodos workers/coordinadores
        server nodo1:8080 resolve max_fails=1 fail_timeout=5s;
        server nodo2:8080 resolve max_fails=1 fail_timeout=5s;
        server nodo3:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        default_type application/json;

        # Tolerancia a fallos en transporte: si un nodo muere antes de recibir el request,
        # Nginx reintenta con el siguiente nodo vivo del upstream upstream.
        proxy_next_upstream error timeout;
        proxy_connect_timeout 300ms;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Límite contractual del payload: 64 KiB
        client_max_body_size 64k;

        # Mapeo de errores de infraestructura al formato simétrico del Contrato R3
        error_page 502 503 504 = @sin_nodos;
        error_page 413 = @demasiado_grande;

        # ----------------------------------------------------------------------
        # Endpoints Públicos Permitidos
        # ----------------------------------------------------------------------
        location = /getRemoteTask {
            proxy_pass http://nodos;
        }

        # /stats consolidado: lo atiende cualquier nodo consultando a sus pares
        location = /stats {
            proxy_pass http://nodos;
        }

        # /health público: informa el estado del cluster y el ID del líder Bully
        location = /health {
            proxy_pass http://nodos;
        }

        # ----------------------------------------------------------------------
        # SEGURIDAD PERIMETRAL: Bloqueo explícito de rutas internas
        # Las rutas del cluster (/cluster/eleccion, /cluster/coordinador, etc.)
        # NO están publicadas hacia Internet y se rechazan con HTTP 404 tipificado.
        # ----------------------------------------------------------------------
        location / {
            return 404 '{"codigo": 404, "contenido": {"error": {"tipo": "RUTA_INEXISTENTE", "mensaje": "no existe la ruta $uri", "detalles": []}}}';
        }

        location @sin_nodos {
            return 502 '{"codigo": 502, "contenido": {"error": {"tipo": "NODO_NO_DISPONIBLE", "mensaje": "ningún nodo pudo atender el pedido", "detalles": []}}}';
        }

        location @demasiado_grande {
            return 413 '{"codigo": 413, "contenido": {"error": {"tipo": "CUERPO_DEMASIADO_GRANDE", "mensaje": "el cuerpo supera los 65536 bytes", "detalles": []}}}';
        }
    }
}
