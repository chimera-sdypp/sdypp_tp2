openapi: 3.1.0
info:
  title: TP2 · Servidor de tareas remotas (Hits 1, 2 y 3)
  version: 1.0.0
  description: |
    Contrato público de los tres servidores. Los tres exponen las mismas rutas (`/getRemoteTask`,
    `/stats` y `/health`); se elige el hit en **Servers**.

    | Hit | Qué agrega |
    |---|---|
    | 1 | Ejecuta cada tarea en un contenedor Docker efímero |
    | 2 | Pool de 4 workers y relojes de Lamport: cabecera `X-Lamport-Clock` (entra y sale en toda respuesta) y `lamport_ts`/`pool` en el cuerpo |
    | 3 | 3 nodos detrás de nginx con coordinador elegido por Bully: `nodo` en la respuesta, `cluster` en `/health` |

    **Sobre:** toda respuesta es `{"codigo", "contenido"}`; en un error, `contenido` es sólo
    `{"error": {"tipo", "mensaje", "detalles"}}`. Los clientes deciden por `tipo`; `mensaje` es
    para personas y puede cambiar. Otra ruta → `404 RUTA_INEXISTENTE`; otro método →
    `405 METODO_NO_PERMITIDO` con `Allow`.

    **Autenticación por request:** `Authorization: Bearer <JWT>` (HS256 con `sub`, `role` y `exp`),
    validada en cada llamada; el servidor no guarda sesión. Roles `usuario` (ejecuta tareas) y `admin`
    (además, `/stats`). Sin token → 401; rol insuficiente → 403; más de 300 pedidos por minuto de un
    usuario → 429 con `Retry-After` (en el Hit 3, por nodo). Sólo `/health` es pública.

    **Sin CORS**, HTTP sin TLS. "Try it out" no anda desde el navegador: usar el `curl` que muestra
    Swagger. No son públicos los mensajes entre nodos del Hit 3 (`/cluster/*`) ni el servicio tarea.

    Más detalle (tabla completa de errores, qué significa cada tiempo y "lo que falta") en
    `contrato-publico.md`.
servers:
  - url: http://54.207.243.253:8081
    description: Hit 1
  - url: http://54.207.243.253:8082
    description: Hit 2
  - url: http://54.207.243.253:8083
    description: Hit 3 (nginx)
security:
  - bearer: []
paths:
  /getRemoteTask:
    post:
      operationId: getRemoteTask
      summary: Ejecutar una tarea en un contenedor efímero
      description: |
        El servidor baja la imagen (con su propio token: el cliente nunca manda credenciales),
        levanta el contenedor, le pasa el trabajo, devuelve el resultado y borra el contenedor.
        La validación rechaza, nunca corrige: tipos estrictos, sin campos de más, sin claves
        duplicadas ni `NaN`, hasta 32 niveles de anidamiento y 64 KiB. La tarea tiene 30 s para
        arrancar y 60 s para contestar.
      parameters:
        - $ref: '#/components/parameters/XLamportClock'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudTarea'
            example:
              calculo: suma
              parametros: {a: 3, b: 4}
              imagen: cerberusdistribuido/tarea:1.0.0
      responses:
        '200':
          description: La tarea terminó.
          headers:
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaTarea'
              examples:
                hit1:
                  value: {codigo: 200, contenido: {calculo: suma, resultado: 7, task_id: 5c4c664a-7bb9-4c17-a2f0-0315091e9944, imagen: 'docker.io/cerberusdistribuido/tarea-prueba:test', digest: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', imagen_id: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', contenedor: 1dc16e0a537b, tiempos: {en_cola_s: 0.0, ejecucion_s: 0.5529, total_s: 0.6799}}}
                hit2:
                  value: {codigo: 200, contenido: {calculo: suma, resultado: 7, task_id: ae3eb90e-c773-4217-a332-76ee96c70229, imagen: 'docker.io/cerberusdistribuido/tarea-prueba:test', digest: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', imagen_id: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', contenedor: 8fd786f5c50b, tiempos: {en_cola_s: 0.0001, ejecucion_s: 0.3432, total_s: 0.4634}, lamport_ts: 4}}
                hit3:
                  value: {codigo: 200, contenido: {calculo: suma, resultado: 7, task_id: f99e3b04-dbc4-42bf-b161-e82de0b281c4, imagen: 'docker.io/cerberusdistribuido/tarea-prueba:test', digest: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', imagen_id: 'sha256:70f35747b244103904729a3de71a1c677a3d1e42119bdb6a76a4b47760a440b4', nodo: 2, contenedor: a4fbfbda587d, tiempos: {en_cola_s: 0.0024, ejecucion_s: 0.3418, total_s: 0.483}}}
        '400': {$ref: '#/components/responses/Error', description: 'Cuerpo vacío o JSON inválido: `CUERPO_VACIO`, `JSON_INVALIDO`.'}
        '401':
          $ref: '#/components/responses/Error'
          description: '`NO_AUTORIZADO`: falta el token, no es un JWT, está firmado con otro secreto, no tiene `exp` o venció. Trae `WWW-Authenticate: Bearer`.'
        '403': {$ref: '#/components/responses/Error', description: 'La imagen no está en la lista blanca, o no coincide con el digest que la lista fija (`IMAGEN_NO_PERMITIDA`); o el rol del token no es `usuario` ni `admin` (`ROL_INSUFICIENTE`).'}
        '413': {$ref: '#/components/responses/Error', description: 'Más de 64 KiB: `CUERPO_DEMASIADO_GRANDE`.'}
        '415': {$ref: '#/components/responses/Error', description: '`Content-Type` distinto de `application/json`: `TIPO_DE_CONTENIDO`.'}
        '422':
          $ref: '#/components/responses/Error'
          description: |
            `PAYLOAD_INVALIDO` (con un elemento en `detalles` por problema), `IMAGEN_INEXISTENTE`,
            o `TAREA_RECHAZADA` (la tarea rechazó los parámetros; el motivo va en `mensaje`).
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
          description: '`DEMASIADOS_PEDIDOS`: el usuario superó su límite de pedidos por minuto. Trae `Retry-After` (segundos).'
        '500': {$ref: '#/components/responses/Error', description: 'Error inesperado: `ERROR_INTERNO`.'}
        '502':
          $ref: '#/components/responses/Error'
          description: |
            `TAREA_FALLIDA` (también si la imagen no es un servicio tarea), `REGISTRY_NO_DISPONIBLE`,
            o en el Hit 3 `NODO_NO_DISPONIBLE` (lo genera
            nginx: no respondió ningún nodo o se cayó el que atendía). Reintentar es seguro: las
            tareas no tienen efectos secundarios.
        '503': {$ref: '#/components/responses/Error', description: 'Docker no responde (`SERVICIO_NO_DISPONIBLE`) o, en el Hit 3, no hay coordinador ni nodos vivos (`CLUSTER_NO_DISPONIBLE`).'}
        '504': {$ref: '#/components/responses/Error', description: 'La tarea no arrancó o no contestó a tiempo: `TAREA_SIN_RESPUESTA`.'}
  /stats:
    get:
      operationId: stats
      summary: Estadísticas del servidor (sólo admin)
      description: |
        Tareas ejecutadas y fallidas, por imagen, latencia promedio y p95 (últimas 1000 tareas, cola
        incluida), tareas en cola, workers ocupados y pedidos por código HTTP. Todo en memoria: se
        reinicia con el servidor. En el Hit 3 los números son del cluster entero (el nodo que atiende
        junta los de los tres; `nodos_sin_respuesta` dice cuáles no contestaron).
      parameters:
        - $ref: '#/components/parameters/XLamportClock'
      responses:
        '200':
          description: Estadísticas.
          headers:
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
              example: {codigo: 200, contenido: {tareas_ejecutadas: 2, tareas_fallidas: 0, tareas_por_imagen: {'docker.io/cerberusdistribuido/tarea:test': {ejecutadas: 2, fallidas: 0}}, latencia_s: {promedio: 0.45, p95: 0.463, muestras: 2}, tareas_en_cola: 0, workers_ocupados: 0, workers_max: 4, pedidos_por_codigo: {'200': 2, '401': 3, '422': 5, '429': 1}, desde: '2026-10-16T02:55:15+00:00', uptime_s: 6, lamport_ts: 42}}
        '401': {$ref: '#/components/responses/Error', description: '`NO_AUTORIZADO`: sin token, o token inválido o vencido.'}
        '403': {$ref: '#/components/responses/Error', description: '`ROL_INSUFICIENTE`: el token es de un `usuario`; hace falta `admin`.'}
  /health:
    get:
      operationId: health
      security: []   # pública: la usan el healthcheck y el despliegue
      summary: Estado del servidor ({servicio, estado})
      description: '`200` si puede ejecutar tareas; `503` si Docker no responde. En el Hit 3 contesta el nodo que elige nginx.'
      parameters:
        - $ref: '#/components/parameters/XLamportClock'
      responses:
        '200':
          description: Puede atender.
          headers:
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                hit1: {value: {codigo: 200, contenido: {servidor: ok, docker: ok}}}
                hit2: {value: {codigo: 200, contenido: {servidor: ok, docker: ok, pool: {workers_activos: 0, workers_max: 4, tareas_encoladas: 0}, lamport_ts: 12824}}}
                hit3: {value: {codigo: 200, contenido: {servidor: ok, docker: ok, cluster: {nodo: 1, coordinador: 3, rol: worker, tareas_en_curso: 0}}}}
        '503':
          description: 'Docker no responde (`"docker": "caido"`).'
          headers:
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /videos:
    post:
      operationId: crearVideo
      summary: Crear un trabajo asíncrono de transcodificación de video (Hits 2 y 3)
      description: |
        Acepta un archivo de video vía `multipart/form-data` o una URL pública vía `application/json`.
        Valida que el tamaño sea <= 1 GiB, duración <= 15 min, resolución <= 4K y calidades <= original.
        Devuelve `202 Accepted` con cabecera `Location: /videos/{id}`.
      parameters:
        - $ref: '#/components/parameters/XLamportClock'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [video, calidades]
              properties:
                video:
                  type: string
                  format: binary
                  description: Archivo de video a transcodificar.
                calidades:
                  type: string
                  example: "720,480"
                  description: Alturas deseadas separadas por comas (1080, 720, 480, 360, 240).
          application/json:
            schema:
              type: object
              required: [url, calidades]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://ejemplo.com/video.mp4"
                calidades:
                  type: array
                  items: {type: integer, enum: [1080, 720, 480, 360, 240]}
                  example: [720, 480]
      responses:
        '202':
          description: Trabajo aceptado y encolado.
          headers:
            Location:
              schema: {type: string}
              description: Ruta para consultar el estado del trabajo (`/videos/{id}`).
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCrearVideo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/DemasiadosPedidos'
        '503':
          $ref: '#/components/responses/Error'

  /videos/{id}:
    get:
      operationId: consultarVideo
      summary: Consultar el estado y progreso de un trabajo de video
      description: |
        Devuelve el estado del trabajo (`en_cola`, `procesando`, `listo`, `error`),
        el progreso numérico (0-100), tiempos y resultados de descarga si terminó.
        Sólo el dueño o un admin pueden consultar.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - $ref: '#/components/parameters/XLamportClock'
      responses:
        '200':
          description: Estado del trabajo.
          headers:
            Retry-After:
              description: Sugerencia de espera mientras no termina.
              schema: {type: integer}
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConsultarVideo'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /videos/{id}/{calidad}:
    get:
      operationId: descargarVideo
      summary: Descargar el video transcodificado en una calidad específica
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: calidad
          in: path
          required: true
          schema: {type: integer, enum: [1080, 720, 480, 360, 240]}
        - $ref: '#/components/parameters/XLamportClock'
      responses:
        '200':
          description: Archivo de video MP4 resultante.
          headers:
            Content-Disposition:
              schema: {type: string}
              example: 'attachment; filename="video_720p.mp4"'
            X-Lamport-Clock:
              $ref: '#/components/headers/XLamportClock'
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT HS256 con `sub` (usuario), `role` (`usuario` o `admin`) y `exp`. Se emite con `evidencias/emitir_token.py`.'
  parameters:
    XLamportClock:
      name: X-Lamport-Clock
      in: header
      description: Sólo Hit 2. Reloj de Lamport del cliente; ordena la cola. Si falta o no es un entero, vale 0.
      schema: {type: integer, minimum: 0}
  headers:
    XLamportClock:
      description: Sólo Hit 2, en toda respuesta. Reloj de Lamport del servidor al contestar.
      schema: {type: integer, minimum: 1}
  responses:
    DemasiadosPedidos:
      description: Límite de pedidos por minuto superado.
      headers:
        Retry-After:
          description: Segundos hasta que se le repone un pedido.
          schema: {type: integer, minimum: 1}
        X-Lamport-Clock:
          $ref: '#/components/headers/XLamportClock'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {codigo: 429, contenido: {error: {tipo: DEMASIADOS_PEDIDOS, mensaje: 'más de 300 pedidos por minuto para ana: reintentá en 1 s', detalles: []}}}
    Error:
      description: Error, en el sobre.
      headers:
        X-Lamport-Clock:
          $ref: '#/components/headers/XLamportClock'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {codigo: 422, contenido: {error: {tipo: TAREA_RECHAZADA, mensaje: división por cero, detalles: []}}}
  schemas:
    SolicitudTarea:
      type: object
      additionalProperties: false
      required: [calculo, parametros, imagen]
      properties:
        calculo:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          maxLength: 64
          description: Con la imagen publicada, `suma`, `resta`, `multiplicacion` o `division`.
        parametros:
          type: object
          description: 'Los interpreta la tarea. La imagen publicada espera `{"a": <número>, "b": <número>}`.'
        datos:
          type: object
          default: {}
        imagen:
          type: string
          maxLength: 255
          description: Con versión fija (tag distinto de `latest`, o digest) y en la lista blanca (en el despliegue, `cerberusdistribuido/tarea`).
    RespuestaTarea:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer, const: 200}
        contenido:
          type: object
          required: [calculo, resultado, task_id, imagen, digest, imagen_id, contenedor, tiempos]
          properties:
            calculo: {type: string}
            resultado: {description: Lo que devolvió la tarea; cualquier valor JSON.}
            task_id: {type: string, format: uuid, description: Identificador de la tarea; también está en el log del servidor.}
            imagen: {type: string, description: 'Imagen ejecutada, normalizada (`docker.io/repo:tag`).'}
            digest: {type: [string, 'null'], description: 'Digest del registry (`sha256:…`) de la imagen ejecutada; `null` si no vino de un registry.'}
            imagen_id: {type: string, description: 'ID local de la imagen (`sha256:…`): identifica el contenido exacto que corrió.'}
            contenedor: {type: string, description: ID corto (12 caracteres) del contenedor que atendió la tarea. Se borra al terminar.}
            tiempos:
              type: object
              required: [en_cola_s, ejecucion_s, total_s]
              properties:
                en_cola_s: {type: number, description: 'Espera antes de empezar. Hit 2: en la cola, esperando un worker. Hit 3: pidiendo nodo al coordinador. Hit 1: siempre 0.'}
                ejecucion_s: {type: number, description: Desde crear el contenedor hasta tener la respuesta de la tarea.}
                total_s: {type: number, description: 'Desde que el servidor empezó a atender el pedido hasta tener la respuesta (validación, descarga de la imagen, cola y ejecución).'}
            lamport_ts: {type: integer, description: Sólo Hit 2. Igual a la cabecera `X-Lamport-Clock`.}
            nodo: {type: integer, description: Sólo Hit 3. ID del nodo que ejecutó la tarea.}
    RespuestaCrearVideo:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer, const: 202}
        contenido:
          type: object
          required: [id, estado, calidades]
          properties:
            id: {type: string, format: uuid, description: Identificador único del trabajo.}
            estado: {type: string, enum: [en_cola, procesando, completado, fallido]}
            calidades:
              type: array
              items: {type: string, enum: ['720p', '480p', '360p', '240p']}
            nodo: {type: integer, description: Sólo Hit 3. ID del nodo que encoló el trabajo.}
    RespuestaConsultarVideo:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer, const: 200}
        contenido:
          type: object
          required: [id, estado, calidades_solicitadas, calidades_disponibles, progreso, duracion_s]
          properties:
            id: {type: string, format: uuid}
            estado: {type: string, enum: [en_cola, procesando, completado, fallido]}
            calidades_solicitadas:
              type: array
              items: {type: string, enum: ['720p', '480p', '360p', '240p']}
            calidades_disponibles:
              type: array
              items: {type: string, enum: ['720p', '480p', '360p', '240p']}
            progreso:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
                maximum: 100
            duracion_s: {type: [number, 'null']}
            error: {type: [string, 'null']}
            nodo: {type: integer, description: Sólo Hit 3.}
    Health:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer, enum: [200, 503]}
        contenido:
          type: object
          required: [servidor, docker]
          properties:
            servidor: {type: string, const: ok}
            docker: {type: string, enum: [ok, caido]}
            pool:
              description: Sólo Hit 2.
              type: object
              properties:
                workers_activos: {type: integer}
                workers_max: {type: integer}
                tareas_encoladas: {type: integer}
            videos:
              description: Métricas de la cola de transcodificación de videos.
              type: object
              properties:
                en_cola: {type: integer}
                procesando: {type: integer}
                max_simultaneos: {type: integer}
                max_en_cola: {type: integer}
            lamport_ts: {type: integer, description: Sólo Hit 2.}
            cluster:
              description: Sólo Hit 3. La vista del nodo que contestó; `nodos` sólo si contestó el coordinador.
              type: object
              properties:
                nodo: {type: integer}
                coordinador: {type: [integer, 'null'], description: '`null` durante una elección.'}
                rol: {type: string, enum: [coordinador, worker]}
                tareas_en_curso: {type: integer}
                nodos:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      estado: {type: string, enum: [vivo, caido]}
                      tareas_en_curso: {type: integer}
                      ultimo_heartbeat_hace: {type: number, description: Segundos.}
    Error:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer}
        contenido:
          type: object
          required: [error]
          properties:
            error:
              type: object
              required: [tipo, mensaje, detalles]
              properties:
                tipo:
                  type: string
                  enum: [CUERPO_VACIO, JSON_INVALIDO, NO_AUTORIZADO, ROL_INSUFICIENTE, DEMASIADOS_PEDIDOS,
                         IMAGEN_NO_PERMITIDA, RUTA_INEXISTENTE, METODO_NO_PERMITIDO,
                         CUERPO_DEMASIADO_GRANDE, TIPO_DE_CONTENIDO, PAYLOAD_INVALIDO, IMAGEN_INEXISTENTE,
                         TAREA_RECHAZADA, ERROR_INTERNO, TAREA_FALLIDA, REGISTRY_NO_DISPONIBLE,
                         SERVICIO_NO_DISPONIBLE, TAREA_SIN_RESPUESTA, NODO_NO_DISPONIBLE, CLUSTER_NO_DISPONIBLE,
                         TRABAJO_INEXISTENTE, CALIDAD_NO_SOLICITADA, RESULTADO_NO_LISTO, VIDEO_DEMASIADO_GRANDE,
                         ARCHIVO_NO_ES_VIDEO, VIDEO_DEMASIADO_LARGO, RESOLUCION_NO_SOPORTADA, CALIDAD_SUPERIOR_AL_ORIGINAL,
                         URL_INVALIDA, URL_INACCESIBLE, DEMASIADOS_TRABAJOS, SERVICIO_SATURADO]
                mensaje: {type: string}
                detalles:
                  type: array
                  description: 'Sólo en `PAYLOAD_INVALIDO`: `[{"campo": "parametros", "problema": "no puede ser null"}]`.'
                  items:
                    type: object
                    properties:
                      campo: {type: string}
                      problema: {type: string}
    Stats:
      type: object
      required: [codigo, contenido]
      properties:
        codigo: {type: integer, const: 200}
        contenido:
          type: object
          required: [tareas_ejecutadas, tareas_fallidas, tareas_por_imagen, latencia_s, tareas_en_cola, workers_ocupados, workers_max, pedidos_por_codigo]
          properties:
            tareas_ejecutadas: {type: integer, description: Terminaron bien en su contenedor.}
            tareas_fallidas: {type: integer, description: 'Llegaron a ejecutarse y terminaron mal (la tarea rechazó los parámetros, falló, no contestó, no se pudo bajar la imagen).'}
            tareas_por_imagen:
              type: object
              additionalProperties:
                type: object
                properties:
                  ejecutadas: {type: integer}
                  fallidas: {type: integer}
            latencia_s:
              type: object
              description: Tiempo total de la tarea, cola incluida, sobre las últimas 1000 tareas.
              properties:
                promedio: {type: [number, 'null']}
                p95: {type: [number, 'null']}
                muestras: {type: integer}
            tareas_en_cola: {type: integer, description: 'Hit 2: la cola del pool. Hits 1 y 3: siempre 0.'}
            workers_ocupados: {type: integer, description: 'Hit 2: workers del pool en uso. Hits 1 y 3: tareas en curso.'}
            workers_max: {type: [integer, 'null'], description: 'Hit 2: el tope del pool. Hits 1 y 3: null.'}
            pedidos_por_codigo:
              type: object
              description: Pedidos a `/getRemoteTask` por código HTTP, incluidos los rechazados antes de ejecutar.
              additionalProperties: {type: integer}
            desde: {type: string, format: date-time}
            uptime_s: {type: integer}
            lamport_ts: {type: integer, description: Sólo Hit 2.}
            nodos:
              description: Sólo Hit 3. El desglose por nodo.
              type: object
              additionalProperties:
                type: object
                properties:
                  tareas_ejecutadas: {type: integer}
                  tareas_fallidas: {type: integer}
                  workers_ocupados: {type: integer}
            nodos_sin_respuesta: {type: array, items: {type: integer}, description: 'Sólo Hit 3. Nodos que no contestaron: los totales son parciales.'}
            atendido_por: {type: integer, description: Sólo Hit 3. El nodo que armó esta respuesta.}
